<!DOCTYPE html>
{% load crispy_forms_tags %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Definir metas</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                {% if messages %}
                    {% for message in messages %}
                        <!-- O Bootstrap usa "success" para verde e "danger" para vermelho (erro) -->
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}               

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0">🎯 Minhas Metas</h4>
                    </div>

                    <div class="card-body p-4">
                        <p class="text-muted text-center mb-4">
                            Defina seus objetivos de calorias e proteínas para acompanhar o seu progresso.
                        </p>
                        <form method="POST" action="">
                            {% csrf_token %}
                            
                            <!-- A prancheta do Django -->
                            <div class="mb-4">
                                {{ form|crispy }}
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">
                                    Salvar Metas
                                </button>
                                <a href="{% url 'painel' %}" class="btn btn-outline-secondary">
                                    Voltar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

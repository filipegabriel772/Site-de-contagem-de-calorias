<!DOCTYPE html>
{% load crispy_forms_tags %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">

                <div class="card-shadow">   
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Entrar no Sistema</h2>

                        {% if form.errors%}
                            <div class="alert alert-danger">Usuário ou senha incorretos</div>
                        {% endif %}   
                        
                        <form class="text-center" method="post">
                            {% csrf_token %}
                            {{ form|crispy }}

                            <button type="submit" class="btn btn-primary w-50 mt-3">Entrar</button>
                        </form>

                        <hr class="my-4">
                        <p class="text-center mb-0">Não tem uma conta? <a href="{% url 'cadastro' %}" class="text-decoration-none">Cadastre-se aqui</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
